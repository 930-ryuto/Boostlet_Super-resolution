[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "boostlet-wavefield-superresolution"
version = "0.1.0"
description = "Reproducible code for Boostlet-based acoustic wavefield super-resolution."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "GPL-3.0-or-later"
authors = [
  {name = "Ryuto Saeki", email = "saekiryuto@keio.jp"},
]
dependencies = [
  "h5py==3.15.1",
  "matplotlib==3.10.8",
  "numpy==2.2.5",
  "pandas==2.3.3",
  "PyWavelets==1.8.0",
  "scikit-image==0.25.2",
  "scipy==1.15.3",
  "tqdm==4.67.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0,<9"]

[project.scripts]
boostlet-run = "boostlet_reconstruction.cli:experiment_main"
boostlet-calibrate = "boostlet_reconstruction.cli:calibration_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyshearlab = ["LICENSE", "copyright.txt"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
